<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>SeedBuddy</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 14px/1.5 system-ui;
      }
      form {
        width: 22rem;
        display: grid;
        gap: 0.75rem;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        opacity: 0.7;
      }
      p:empty {
        display: none;
      }
      #refused {
        color: #c0392b;
        opacity: 1;
      }
      input,
      button {
        font: inherit;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      }
      button {
        color: Canvas;
        background: CanvasText;
        border-color: transparent;
      }
      button:disabled {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <!-- The app takes the address this form navigates to and opens the workbench there. -->
    <form>
      <h1 id="heading"></h1>
      <p id="hint"></p>
      <input
        id="server"
        name="server"
        type="text"
        inputmode="url"
        placeholder="seedbuddy.example.org"
        autocapitalize="off"
        spellcheck="false"
        required
      />
      <p id="refused" role="alert"></p>
      <button id="connect" type="submit"></button>
    </form>
    <script>
      // The app hands the page its words, and the address it last tried.
      const words = new URLSearchParams(location.search);
      document.documentElement.lang = words.get("lang") ?? "";
      for (const [id, value] of words) {
        const element = document.getElementById(id);
        if (element instanceof HTMLInputElement) element.value = value;
        else if (element) element.textContent = value;
      }
      // One address is tried at a time.
      document.querySelector("form").addEventListener("submit", () => {
        document.getElementById("connect").disabled = true;
      });
    </script>
  </body>
</html>

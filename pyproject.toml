[project]
name = "seedctl"
version = "0.1.0"
description = "Operator CLI and native Worker runtime for a SeedBuddy workbench"
readme = "docs/seedctl.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Richard Wang" }]
keywords = ["seed-germination", "seed-counting", "object-detection", "yolo", "worker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.25",
  "numpy>=2.0",
  "opencv-python-headless>=5.0",
]

[project.optional-dependencies]
yolo = [
  "ultralytics==8.4.131",
]

[project.scripts]
seedctl = "seedctl.cli:main"

[project.urls]
Repository = "https://github.com/i-richardwang/SeedBuddy"
Issues = "https://github.com/i-richardwang/SeedBuddy/issues"

[dependency-groups]
dev = [
  "pyright>=1.1.405",
  "pytest>=8.0",
  "ruff>=0.12",
  "seedbuddy",
]

[tool.uv.workspace]
members = ["packages/seedbuddy"]

[tool.uv.sources]
seedbuddy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/seedbuddy/tests"]
addopts = "-m 'not reference'"
markers = [
  "reference: requires the checksum-pinned private reference images",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"src/seedctl/detectors/traditional/config.py" = ["TRY004"]
"src/seedctl/detectors/traditional/scoring.py" = ["TRY004"]

[tool.pyright]
include = ["src", "scripts", "packages/seedbuddy/src", "tests", "packages/seedbuddy/tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.hatch.build.targets.wheel]
packages = ["src/seedctl"]

[tool.hatch.build.targets.sdist]
include = [
  "/docs/seedctl.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/seedctl",
]


[project]
name = "vitroctl"
version = "0.1.0"
description = "Operator CLI and native Worker runtime for a VitroFlow workbench"
readme = "docs/vitroctl.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richard Wang" }]
keywords = ["plant-tissue-culture", "seed-counting", "object-detection", "yolo", "worker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.25",
  "numpy>=2.0",
  "opencv-python-headless>=5.0",
]

[project.optional-dependencies]
yolo = [
  "ultralytics==8.4.131",
]

[project.scripts]
vitroctl = "vitroctl.cli:main"

[project.urls]
Repository = "https://github.com/i-richardwang/VitroFlow"
Issues = "https://github.com/i-richardwang/VitroFlow/issues"

[dependency-groups]
dev = [
  "pyright>=1.1.405",
  "pytest>=8.0",
  "ruff>=0.12",
  "vitroflow",
]

[tool.uv.workspace]
members = ["packages/vitroflow"]

[tool.uv.sources]
vitroflow = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/vitroflow/tests"]
addopts = "-m 'not reference'"
markers = [
  "reference: requires the checksum-pinned private reference images",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"src/vitroctl/detectors/traditional/config.py" = ["TRY004"]
"src/vitroctl/detectors/traditional/scoring.py" = ["TRY004"]

[tool.pyright]
include = ["src", "scripts", "packages/vitroflow/src", "tests", "packages/vitroflow/tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.hatch.build.targets.wheel]
packages = ["src/vitroctl"]

[tool.hatch.build.targets.sdist]
include = [
  "/docs/vitroctl.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/vitroctl",
]


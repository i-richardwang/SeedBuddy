name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_LOCKED: "true"
      BETTER_AUTH_SECRET: ci-storage-only-not-an-application-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: uv sync --locked
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: make check
      - name: Start isolated storage
        run: |
          docker compose -p vitroflow-ci up -d --wait postgres rustfs
          docker compose -p vitroflow-ci run --rm bucket
      - name: Verify PostgreSQL and S3 contracts
        env:
          VITROFLOW_TEST_DATABASE_URL: postgres://vitroflow:vitroflow@localhost:5432/vitroflow
          VITROFLOW_TEST_S3_ENDPOINT: http://localhost:9000
          VITROFLOW_TEST_S3_BUCKET: vitroflow
          AWS_ACCESS_KEY_ID: vitroflow
          AWS_SECRET_ACCESS_KEY: vitroflow
          AWS_REGION: us-east-1
        run: make check-postgres check-s3
      - name: Remove test storage
        if: always()
        run: docker compose -p vitroflow-ci down --volumes

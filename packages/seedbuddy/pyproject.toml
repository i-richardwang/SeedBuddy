[project]
name = "seedbuddy"
version = "0.2.0"
description = "Prepare culture-dish photographs for a SeedBuddy workbench"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Richard Wang" }]
keywords = ["seed-germination", "culture-dish", "photography", "focus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=5.0",
]

[project.scripts]
seedbuddy = "seedbuddy.cli:main"

[project.urls]
Repository = "https://github.com/i-richardwang/SeedBuddy"
Issues = "https://github.com/i-richardwang/SeedBuddy/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seedbuddy"]
